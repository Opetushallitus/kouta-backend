name: Kouta-backend

# Empty in main. Set to a ticket id (e.g. "OY-1234") on a dev branch
# to deploy under version <base-version>-<TICKET>-SNAPSHOT.
# MUST be empty before merging to main.
env:
  DEV_BRANCH_DEPLOY: ''

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Set timezone to Europe/Helsinki
        run: |
          sudo timedatectl set-timezone Europe/Helsinki
          echo "Europe/Helsinki" | sudo tee /etc/timezone

      - name: Start postgres container
        run: |
          cd kouta-backend/postgresql/docker
          docker build --tag kouta-postgres .

      - name: Build with Maven
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone https://github.com/Opetushallitus/ci-tools.git
          source ci-tools/common/setup-tools.sh
          mvn clean package -B --settings settings.xml

      - uses: actions/cache@v6
        id: restore-build
        with:
          path: | 
            kouta-backend/target
            ovara-kouta/target
          key: ${{ github.sha }}

      - uses: actions/cache@v6
        id: ci-tools
        with:
          path: ci-tools
          key: ${{ github.sha }}

  deploy_image:
    runs-on: ubuntu-latest
    needs: test_and_build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: restore-build
        with:
          path: |
            kouta-backend/target
            ovara-kouta/target
          key: ${{ github.sha }}

      - uses: actions/cache@v6
        id: ci-tools
        with:
          path: ci-tools
          key: ${{ github.sha }}

      - name: Build Docker container
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          export ARTIFACT_NAME="kouta-backend"
          export OVARA_EXPORTER_NAME="ovara-kouta"
          export BASE_IMAGE="baseimage-fatjar-openjdk21:master"
          source ci-tools/common/setup-tools.sh

          mv kouta-backend/target/kouta-backend-*-jar-with-dependencies.jar $DOCKER_BUILD_DIR/artifact/${ARTIFACT_NAME}.jar
          cp -vr kouta-backend/src/main/resources/* $DOCKER_BUILD_DIR/config/
          ./ci-tools/common/pull-image.sh
          ./ci-tools/github-build/build-fatjar.sh $ARTIFACT_NAME

          ./ci-tools/common/clean-docker-build-dir.sh
          
          mv ovara-kouta/target/ovara-kouta-*-jar-with-dependencies.jar $DOCKER_BUILD_DIR/artifact/${OVARA_EXPORTER_NAME}.jar
          cp -vr ovara-kouta/src/main/resources/* $DOCKER_BUILD_DIR/config/
          cp -v kouta-backend/src/main/resources/oph-configuration/kouta-backend.properties.template $DOCKER_BUILD_DIR/config/oph-configuration/
          cat $DOCKER_BUILD_DIR/config/oph-configuration/ovara-kouta.additional.properties.template $DOCKER_BUILD_DIR/config/oph-configuration/kouta-backend.properties.template
          rm $DOCKER_BUILD_DIR/config/oph-configuration/ovara-kouta.additional.properties.template
          ./ci-tools/common/pull-image.sh
          ./ci-tools/github-build/build-fatjar.sh $OVARA_EXPORTER_NAME

          ./ci-tools/github-build/upload-image.sh $ARTIFACT_NAME
          ./ci-tools/github-build/upload-image.sh $OVARA_EXPORTER_NAME

  deploy_to_github_packages:
    runs-on: ubuntu-latest
    needs: test_and_build

    steps:
      - name: Refuse dev-only configuration on main
        if: env.DEV_BRANCH_DEPLOY != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::DEV_BRANCH_DEPLOY is set to '${DEV_BRANCH_DEPLOY}' on main. Clear it before merging."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: ci-tools
        with:
          path: ci-tools
          key: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Rewrite artifact versions with ticket id
        if: env.DEV_BRANCH_DEPLOY != ''
        run: |
          set -euo pipefail

          # Molemmat versiot on luettava ennen ensimmäistä versions:set-kutsua,
          # koska se ylikirjoittaa myös kouta-commonin version.
          # Huom! Maven kirjoittaa myös virheet stdoutiin, jonka $( ) nielaisee, joten
          # ilman || -haaraa step kaatuisi näyttämättä mitään lokia.
          ROOT_CURRENT=$(mvn -q -B -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec) || { echo "$ROOT_CURRENT"; exit 1; }
          COMMON_CURRENT=$(mvn -q -B -f kouta-common/pom.xml -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec) || { echo "$COMMON_CURRENT"; exit 1; }
          ROOT_NEW="${ROOT_CURRENT%-SNAPSHOT}-${DEV_BRANCH_DEPLOY}-SNAPSHOT"
          COMMON_NEW="${COMMON_CURRENT%-SNAPSHOT}-${DEV_BRANCH_DEPLOY}-SNAPSHOT"

          # 1) Kaikki moduulit ticket-versioon (korjaa samalla <parent>-viittaukset).
          mvn -B versions:set -DnewVersion="$ROOT_NEW" -DgenerateBackupPoms=false -DprocessAllModules=true -DupdateMatchingVersions=true
          # 2) kouta-common takaisin omalle versiolinjalleen, jota muut repot (kouta-external, kouta-internal) käyttävät.
          mvn -B -f kouta-common/pom.xml versions:set -DnewVersion="$COMMON_NEW" -DgenerateBackupPoms=false
          # 3) versions:set ei seuraa propertyjä, joten kouta-backendin riippuvuusversio on asetettava erikseen.
          mvn -B -f kouta-backend/pom.xml versions:set-property -Dproperty=kouta-common.version -DnewVersion="$COMMON_NEW" -DgenerateBackupPoms=false

      - name: Deploy to Github Packages
        if: success() && (env.DEV_BRANCH_DEPLOY != '' || format('refs/heads/{0}', github.event.repository.default_branch) == github.ref)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn deploy -B -DskipTests --settings settings.xml
